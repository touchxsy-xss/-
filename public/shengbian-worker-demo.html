<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>声边｜维修人员小程序</title>
  <style>
    :root { color: #234b39; background: #eef4ed; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; } body { margin: 0; padding: 22px 14px; } .shell { width: min(520px, 100%); margin: auto; overflow: hidden; border: 1px solid #cfe1ce; border-radius: 23px; background: #fff; box-shadow: 0 18px 50px rgba(28, 76, 50, .16); }
    header { padding: 22px 20px 16px; color: #f4fff4; background: linear-gradient(145deg, #28674b, #174c3a); } header small { color: #c7e4d0; font-size: 12px; font-weight: 700; } h1 { margin: 6px 0 3px; font-size: 22px; } header p { margin: 0; color: #dcefe2; font-size: 13px; }
    main { padding: 14px; } .summary { display: flex; gap: 9px; margin-bottom: 12px; } .chip { flex: 1; padding: 9px; border-radius: 10px; color: #557564; background: #f2f8f0; font-size: 11px; text-align: center; } .chip b { display: block; margin-top: 3px; color: #234b39; font-size: 17px; }
    .empty, .ticket { padding: 14px; border: 1px solid #dcebdc; border-radius: 14px; background: #fbfdf8; } .ticket { margin-top: 10px; } .ticket-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; } .ticket h2 { margin: 0; font-size: 15px; } .ticket p { margin: 7px 0 0; color: #607d6d; font-size: 12px; line-height: 1.55; } .ticket small { color: #789486; }
    .status { display: inline-block; padding: 4px 7px; border-radius: 99px; color: #31744d; background: #e2f1d8; font-size: 10px; font-weight: 800; white-space: nowrap; }.status.waiting { color: #92612b; background: #fff0d5; }.status.complete { color:#296d55;background:#dff0e5;}
    .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 13px 0; } .step { padding: 7px 3px; border-radius: 8px; color: #82978a; background:#eef4ed; font-size: 9px; text-align: center; } .step.done { color:#fff;background:#397a57; }
    details { margin-top: 9px; } summary { cursor: pointer; color: #28674b; font-size: 12px; font-weight: 800; } label { display: block; margin: 10px 0 4px; color:#4d6e5b; font-size: 11px; font-weight: 800; } input, textarea { width:100%; padding: 9px; border:1px solid #c9dbc5; border-radius:8px; color:#234b39; font:inherit; font-size:12px; } textarea { min-height: 66px; resize:vertical; } input[type=file] { padding: 7px; background:#f7fbf5; } .hint { display:block; margin-top:4px; color:#82978a; font-size:10px; }
    .actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:11px; } button { padding:8px 10px; border:0; border-radius:8px; color:#fff; background:#174f3c; font:inherit; font-size:11px; font-weight:700; cursor:pointer; } button.subtle { color:#28543f; background:#e4f1df; } button:disabled { cursor:not-allowed; opacity:.5; } .toast { position:fixed; right:16px; bottom:16px; max-width:310px; padding:10px 13px; border-radius:10px; color:#fff; background:#234b39; font-size:12px; opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; }.toast.show { opacity:1; transform:translateY(0); }
  </style>
</head>
<body data-default-role="worker" data-single-role="true">
  <section class="shell">
    <header><small>SHENGBIAN WORKER MINI PROGRAM</small><h1>维修人员工作台</h1><p id="worker-subtitle">正在加载分配给你的工单…</p></header>
    <main><section class="summary" id="worker-summary"></section><section id="worker-tickets"><div class="empty">正在获取工单。</div></section></main>
  </section>
  <div class="toast" id="toast"></div>
  <script>
    function showToast(message) { const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => toast.classList.remove('show'), 3000); }
  </script>
  <script src="shengbian-live.js"></script>
</body>
</html>
